components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        bb_live_ (personal, agent, integration) or bb_sess_ (browser session) token. Optional headers:
        X-Bigbuck-Act-As-Agent (act as one of your agents with a session or personal token) and
        X-Bigbuck-Surface (web, api, cli, mcp, agent) recorded in audit.
  parameters:
    OrganizationId:
      name: X-Organization-Id
      in: header
      required: false
      description: Optional. The organization comes from the bearer credential; if sent, it must match.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem+json
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code, request_id]
            properties:
              type: { type: string, format: uri }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
              detail: { type: string }
              param: { type: string }
              request_id: { type: string }
  schemas:
    PanelBookingInput:
      type: object
      required: [organizer_calendar, search_start, search_end, interview_defs, profiles, user_emails]
      properties:
        organizer_calendar: { type: string }
        search_start: { type: string, format: date-time }
        search_end: { type: string, format: date-time, description: At most fourteen days after search_start }
        interview_defs:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, duration_minutes, count, candidate_user_ids]
            properties:
              key: { type: string }
              duration_minutes: { type: integer, minimum: 15, maximum: 480 }
              count: { type: integer, minimum: 1, maximum: 10 }
              candidate_user_ids: { type: array, minItems: 1, items: { type: string } }
        profiles:
          type: array
          items:
            type: object
            required: [user_id]
            properties:
              user_id: { type: string }
              paused: { type: boolean }
        user_emails: { type: object, additionalProperties: { type: string, format: email } }
    PostingQuestion:
      type: object
      required: [key, label, field_type]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        label: { type: string, maxLength: 500 }
        field_type: { type: string, enum: [text, long_text, number, boolean, email, url, select, multi_select] }
        required: { type: boolean }
        options: { type: array, maxItems: 100, items: { type: string }, uniqueItems: true }
    PostingInput:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        audience: { type: string, enum: [public, internal, both, hidden] }
        status: { type: string, enum: [draft, published, archived] }
        expected_version: { type: integer }
