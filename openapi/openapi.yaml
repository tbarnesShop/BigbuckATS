          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Counts created, refreshed, skipped and per bucket
  /jobs/{job_id}/rediscovery/queue:
    get:
      operationId: listRediscoveryQueue
      summary: The rediscovery review queue with per-criterion verdicts and evidence
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { name: status, in: query, schema: { type: string, enum: [pending, considering, added_to_pool, enrolled, not_a_fit, review_later] } }
        - { name: bucket, in: query, schema: { type: string, enum: [silver_medalist, high_fit, internal_transfer, warm_lead] } }
      responses:
        "200":
          description: Queue
  /rediscovery_candidates/{id}/review:
    post:
      operationId: reviewRediscoveryCandidate
      summary: Act on a queued person (consider, add_to_pool, enroll, not_a_fit, review_later), with optional feedback
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_action]
              properties:
                review_action: { type: string, enum: [consider, add_to_pool, enroll, not_a_fit, review_later] }
                feedback: { type: string }
                project_id: { type: string, format: uuid }
                sequence_id: { type: string, format: uuid }
                mailbox_id: { type: string, format: uuid }
      responses:
        "200":
          description: Updated queue row with the action's outcome
  /jobs/{job_id}/sourcing_agent/run:
    post:
      operationId: runSourcingAgent
      summary: "Run the sourcing agent for a job: refresh rediscovery from the job's criteria and propose enrollments with drafted openers (pending approval unless org policy is unattended)"
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sequence_id]
              properties:
                sequence_id: { type: string, format: uuid }
                agent_id: { type: string, format: uuid }
                mailbox_id: { type: string, format: uuid }
                limit: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Proposed ids, counts and skip reasons
