openapi: 3.1.0
info:
  title: Big Buck API
  version: "2026-11-01"
  description: >-
    Public REST API for Big Buck (ATS + talent CRM). One contract for the app, CLI, MCP tools, and integrations.
    Every non-public operation authenticates with a bearer credential (Authorization: Bearer bb_...).
    The credential decides the organization and the actor; X-Organization-Id is optional and must match it.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /people/{person_id}/documents:
    get:
      operationId: listPersonDocuments
      summary: List a visible person's resume and document metadata
      description: Requires document.read. Returns availability and scan status without storage keys or file URLs.
      parameters:
        - name: person_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Visible person documents, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, filename, content_type, byte_size, scan_status, created_at, downloadable]
                      properties:
                        id: { type: string, format: uuid }
                        filename: { type: string }
                        content_type: { type: string }
                        byte_size: { type: integer }
                        scan_status: { type: string, enum: [pending, clean, infected, failed] }
                        created_at: { type: string, format: date-time }
                        downloadable: { type: boolean }
        "403":
          description: Document read permission required
        "404":
          description: Person is not visible
    post:
      operationId: replacePersonResume
      summary: Upload and replace a visible person's current resume
      description: Requires document.upload. Accepts PDF, plain text or DOCX up to 10 MB. A valid upload supersedes previous resumes without erasing their history. New files remain quarantined until a clean security scan. Use multipart for browser files or base64 JSON for integrations.
      parameters:
        - name: person_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: object
                  required: [filename, content_type, content_base64]
                  properties:
                    filename: { type: string }
                    content_type: { type: string, enum: [application/pdf, text/plain, application/vnd.openxmlformats-officedocument.wordprocessingml.document] }
                    content_base64: { type: string, contentEncoding: base64 }
      responses:
        "201":
          description: Replacement resume metadata with pending scan status
        "403":
          description: Upload permission required
        "404":
          description: Person is not visible
        "422":
          description: Invalid, empty, oversized or unsupported file; the current resume is retained
  /people/{person_id}/documents/{id}:
    get:
      operationId: getPersonDocument
      summary: Read a clean attached file belonging to a visible person
      description: Requires document.read. PDF and text may be viewed inline; other files download. Quarantined, missing, erased and inaccessible files are unavailable. Returns file bytes, not JSON.
      parameters:
        - name: person_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: download
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Private file bytes with inline or attachment Content-Disposition
          content:
            application/pdf:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string }
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Document read permission required
        "404":
          description: File is not available or not visible
  /organizations:
    post:
      operationId: createOrganization
      security: []
      summary: Provision an organization with owner role and seeded dimensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization]
              properties:
                organization:
                  type: object
                  required: [name, slug, owner_email, owner_name]
                  properties:
                    name: { type: string }
                    slug: { type: string }
                    owner_email: { type: string, format: email }
                    owner_name: { type: string }
      responses:
        "201":
          description: Created
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string }
                  service: { type: string }
  /people:
    get:
      operationId: listPeople
      summary: List people in the current organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: q
          in: query
          schema: { type: string }
        - name: lifecycle_stage
          in: query
          schema: { type: string }
        - name: visibility
          in: query
          schema: { type: string }
        - name: do_not_contact
          in: query
          schema: { type: boolean }
        - name: owner_user_id
          in: query
          schema: { type: string, format: uuid }
        - name: tag
          in: query
          description: Comma-separated tag names; the person needs every one
          schema: { type: string }
        - name: not_tag
          in: query
          description: Comma-separated tag names to exclude
          schema: { type: string }
        - name: source
          in: query
          description: "Comma-separated sources: sourced, referral, applied, event, import, agent"
          schema: { type: string }
        - name: engagement_status
          in: query
          description: "Comma-separated: not_contacted, contacted, replied, interested, not_interested, do_not_contact"
          schema: { type: string }
        - name: location
          in: query
          description: Matches city, region or country
          schema: { type: string }
        - name: title
          in: query
          description: Substring of the current title
          schema: { type: string }
        - name: company
          in: query
          description: Substring of a company the person is affiliated with
          schema: { type: string }
        - name: not_contacted_days
          in: query
          description: Never contacted, or last contacted more than N days ago
          schema: { type: integer }
        - name: contacted_within_days
          in: query
          description: Contacted in the last N days
          schema: { type: integer }
        - name: has_email
          in: query
          description: true or false
          schema: { type: boolean }
        - name: sort
          in: query
          description: recent (default), name, activity, relevance (relevance needs q)
          schema: { type: string }
        - name: limit
          in: query
          description: Page size, 1-500 (default 100)
          schema: { type: integer }
        - name: page
          in: query
          description: 1-based page; meta.total is the full match count
          schema: { type: integer }
      responses:
        "200":
          description: "People list with meta { page, per_page, total }. q takes words that must all match somewhere on the person (name, email, headline, title, city, company, a tag, a note); custom[field_key]=value filters by an internal custom field."
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPerson
      summary: Create a person
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person]
              properties:
                person:
                  type: object
                  required: [display_name]
                  properties:
                    display_name: { type: string }
                    email: { type: string }
                    phone: { type: string }
                    headline: { type: string }
                    current_title: { type: string }
                    current_company_id: { type: string }
                    city: { type: string }
                    time_zone: { type: string, description: IANA zone the send window uses }
                    source: { type: string, enum: [sourced, referral, applied, event, import, agent], description: Set once; defaults to sourced (agent when an agent creates it) }
                    source_detail: { type: string }
                    engagement_status: { type: string, enum: [not_contacted, contacted, replied, interested, not_interested] }
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Problem"
  /people/{id}:
    get:
      operationId: getPerson
      summary: Get a person
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Person
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePerson
      summary: Update person contact, company, and CRM fields
      description: Contact and company edits require person.edit_details or person.update. Owner, DNC, and lifecycle changes require person.update.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                person:
                  type: object
                  properties:
                    display_name: { type: string }
                    headline: { type: string }
                    current_title: { type: string }
                    current_company_id: { type: string }
                    city: { type: string }
                    time_zone: { type: string }
                    engagement_status: { type: string, enum: [not_contacted, contacted, replied, interested, not_interested], description: A recruiter's decision; do_not_contact follows the DNC flag. }
                    email: { type: string, description: Normalized primary email; an empty value clears it. Duplicate contacts are rejected without exposing another record. }
                    phone: { type: string, description: Normalized primary phone; an empty value clears it. }
                    affiliation:
                      type: object
                      required: [company_id]
                      properties:
                        id: { type: string, format: uuid, description: An existing affiliation belonging to this person. Omit to add a company. }
                        company_id: { type: string, format: uuid }
                        title: { type: string }
                    owner_user_id: { type: string, format: uuid }
                    do_not_contact: { type: boolean }
                    do_not_contact_reason: { type: string }
                    lifecycle_stage: { type: string }
      responses:
        "200":
          description: Updated
  /people/bulk:
    post:
      operationId: bulkPeopleAction
      summary: Bulk enroll, DNC, or add people to a project
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bulk_action, person_ids]
              properties:
                bulk_action: { type: string, enum: [enroll_sequence, set_dnc, clear_dnc, add_to_project, tag, untag] }
                person_ids: { type: array, items: { type: string, format: uuid } }
                sequence_id: { type: string, format: uuid }
                mailbox_id: { type: string, format: uuid }
                project_id: { type: string, format: uuid }
                reason: { type: string }
                tag_id: { type: string, format: uuid }
                tag_name: { type: string, description: 'For tag/untag when you have the name, not the id' }
      responses:
        "200":
          description: Bulk results
  /jobs:
    get:
      operationId: listJobs
      summary: List jobs in the current organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Jobs list
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createJob
      summary: Create a job
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job]
              properties:
                job:
                  type: object
                  required: [title]
                  properties:
                    title: { type: string }
                    status: { type: string }
                    pipeline_id: { type: string, format: uuid }
                    careers_visibility: { type: string, enum: [public, internal, both, hidden], default: public }
                    description: { type: string, description: "Job description for the posting created with the job" }
                    location: { type: string }
                    employment_type: { type: string, enum: [full_time, part_time, contract, internship, temporary] }
                    question_template_id: { type: string, format: uuid, description: "Copy this active question template onto the new posting" }
                    department_id: { type: string, format: uuid, description: "A value of the department dimension (see GET /jobs/form_options)" }
                    hiring_manager_user_id: { type: string, format: uuid, description: "An active member to put on the hiring team as hiring manager; they approve the job's offers" }
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Problem"
  /jobs/form_options:
    get:
      operationId: jobFormOptions
      summary: Departments and active members to choose from when creating a job
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: "{ departments: [{ id, key, label }], members: [{ user_id, name, email, role_key }] }"
        "401":
          $ref: "#/components/responses/Problem"
  /jobs/{id}/hiring_team/members:
    post:
      operationId: addHiringTeamMember
      summary: Put an active member on the job's hiring team in a role
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, team_role]
              properties:
                user_id: { type: string, format: uuid }
                team_role: { type: string, enum: [hiring-manager, recruiter, coordinator, interviewer], description: "hiring_manager is accepted as hiring-manager" }
      responses:
        "201":
          description: The job, with its updated hiring team
  /jobs/{id}/hiring_team/members/{member_id}:
    patch:
      operationId: updateHiringTeamMember
      summary: Change a hiring team member's role on the job
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: member_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_role]
              properties:
                team_role: { type: string, enum: [hiring-manager, recruiter, coordinator, interviewer] }
      responses:
        "200": { description: The job, with its updated hiring team }
        "409": { $ref: "#/components/responses/Problem" }
  /jobs/{id}/hiring_team/members/{member_id}/remove:
    post:
      operationId: removeHiringTeamMember
      summary: Take a member off the job's hiring team
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: member_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The job, with its updated hiring team }
  /jobs/{id}/pipeline:
    patch:
      operationId: updateJobPipeline
      summary: Add, rename, reorder or remove a stage on the job's pipeline
      description: Hired is a fixed final stage. A stage with candidates in it cannot be removed. Edits are stored as overrides on the pipeline template.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [op]
              properties:
                op: { type: string, enum: [add_stage, rename_stage, move_stage, remove_stage, add_interview, remove_interview] }
                key: { type: string, description: "Stage key (all ops except add_stage)" }
                name: { type: string, description: "Stage name (add_stage, rename_stage)" }
                type: { type: string, enum: [apply, screen, review, interview, offer], description: "add_stage; default interview" }
                after: { type: string, description: "add_stage: key to insert after; default the last stage before Hired" }
                direction: { type: string, enum: [up, down], description: "move_stage" }
                interview_key: { type: string, description: "remove_interview" }
                required: { type: boolean, description: "add_interview; default true" }
                rubric_key: { type: string, description: "add_interview: scorecard rubric; omit for an overall rating only" }
                duration_minutes: { type: integer, description: "add_interview" }
      responses:
        "200": { description: The job, with its updated pipeline }
        "422": { $ref: "#/components/responses/Problem" }
  /jobs/{id}:
    get:
      operationId: getJob
      summary: Get a job
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateJob
      summary: Update job openings, careers audience, and publication
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job:
                  type: object
                  properties:
                    openings: { type: integer, minimum: 0 }
                    careers_visibility: { type: string, enum: [public, internal, both, hidden] }
                    careers_published:
                      type: boolean
                      description: Publish or unpublish job postings. Publishing requires an active job.
      responses:
        "200":
          description: Updated job
        "422":
          $ref: "#/components/responses/Problem"
  /applications:
    get:
      operationId: listApplications
      summary: List applications across jobs (filter with status and stage)
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: job_id
          in: query
          schema: { type: string, format: uuid }
        - name: person_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: archived returns rejected and withdrawn applications, each with closed_reason and closed_at
          schema: { type: string, enum: [active, rejected, withdrawn, hired, archived] }
        - name: stage
          in: query
          description: current_stage_key
          schema: { type: string }
        - name: sort
          in: query
          description: mine puts the caller's hiring-team jobs and owned people first
          schema: { type: string, enum: [mine] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Applications list
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApplication
      summary: Create an application
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application]
              properties:
                application:
                  type: object
                  required: [job_id, person_id]
                  properties:
                    job_id: { type: string, format: uuid }
                    person_id: { type: string, format: uuid }
                    locale: { type: string }
                    consents:
                      type: array
                      items: { type: string }
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Problem"
  /applications/{id}:
    get:
      operationId: getApplication
      summary: Get an application (includes person, job, pipeline stages, offers)
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Application
        "404":
          $ref: "#/components/responses/Problem"
  /applications/{id}/transitions:
    get:
      operationId: listApplicationTransitions
      summary: Stage transition history for an application
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transition history
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createApplicationTransition
      summary: Move, reject, withdraw, or hire an application
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  enum: [move, reject, withdraw, hire]
                  default: move
                to_stage_key: { type: string }
                reason: { type: string }
      responses:
        "201":
          description: Transition applied; returns updated application
        "422":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /offers:
    get:
      operationId: listOffers
      summary: List offers, with counts by status. status filters the rows; counts stay the breakdown before that filter.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: application_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_approval, changes_requested, approved, sent, accepted, declined, expired, rescinded]
      responses:
        "200":
          description: Offers list
        "401":
          $ref: "#/components/responses/Problem"
  /offers/{id}:
    get:
      operationId: getOffer
      summary: Get an offer
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Offer
        "404":
          $ref: "#/components/responses/Problem"
  /offers/{id}/submit:
    post:
      operationId: submitOffer
      summary: Submit offer for approval
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Submitted
  /offers/{id}/approve:
    post:
      operationId: approveOffer
      summary: Approve a pending offer approval
      description: The assigned approver approves their step. An organization owner may pass override=true to approve a step assigned to someone else; it is recorded as an override.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                override: { type: boolean, description: "Owner only" }
      responses:
        "200":
          description: Approved
        "403":
          $ref: "#/components/responses/Problem"
  /offers/{id}/send:
    post:
      operationId: sendOffer
      summary: Send approved offer letter; returns candidate token
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sent
  /offers/{id}/record_response:
    post:
      operationId: recordOfferResponse
      summary: Record the candidate's answer to a sent offer when it arrived outside the signed link
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: { type: string, enum: [accepted, declined] }
                note: { type: string }
      responses:
        "201":
